<!DOCTYPE html>
<html>
<head>
  <title>Toggle Paragraph Example</title>
  <style>
    /* CSS */
    #useless-paragraph {
      display: block;
      color: gray;
      font-style: italic;
      transition: all 0.3s ease;
    }

    button {
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- HTML -->
  <h1>I am a headline made with HTML</h1>
  <br />
  <p id="useless-paragraph">Useless paragraph.</p>
  <br />
  <button onclick="toggleVisibility()">Toggle Button</button>

  <script>
    // JavaScript
    function toggleVisibility() {
      const para = document.getElementById("useless-paragraph");
      const currentDisplay = para.style.display;

      // if hidden, display block
      if (currentDisplay === "none") {
        para.style.display = "block";
      } 
      // if block, display hidden
      else {
        para.style.display = "none";
      }
    }
  </script>

</body>
</html>
